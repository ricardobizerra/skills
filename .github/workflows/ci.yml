name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run repository integrity & parity checks
        run: node scripts/validate-repo.mjs

      - name: Run verify-smoke self-test
        run: node skills/engineering/verify/scripts/verify-smoke.mjs --self-test
